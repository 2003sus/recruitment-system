spring.application.name=recruitment-backend

spring.datasource.url=jdbc:mysql://localhost:3306/recruitment?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=224430
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true

# 文件上传目录（相对于项目根目录）
upload.dir=${user.dir}/uploads/recruitment
# 单个文件最大 10MB
spring.servlet.multipart.max-file-size=10MB
# 整个请求最大 10MB
spring.servlet.multipart.max-request-size=10MB